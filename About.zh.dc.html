  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lor:#2B2A26\">科学依据<\u002Fa>\n        <a href=\"About.zh.dc.html\" style=\"font:600 13px/1 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.12em;color:#B3453A\">关于<\u002Fa>\n        <a href=\"Books.zh.dc.html\" style=\"font:600 13px/1 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.12em;color:#2B2A26\">图书<\u002Fa>\n        <a href=\"Intake.zh.dc.html\" style=\"display:inline-flex;align-items:center;gap:7px;background:#38546E;color:#F6F2E9;font:600 13px/1 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.08em;padding:11px 20px;border-radius:24px\">预约解读 <span style=\"font-size:13px\">›<\u002Fspan><\u002Fa>\n      <a data-lang-switch=\"\" href=\"About.dc.html\" style=\"display:inline-flex;align-items:center;font:600 12px/1 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.06em;color:#38546E;border:1px solid #38546E55;border-radius:20px;padding:8px 13px\">EN<\u002Fa><\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ HERO / PORTRAIT ============ -->\n  <section data-screen-label=\"hero\" style=\"position:relative;background:#F1ECDE;border-bottom:1px solid #2B2A2618;background-image:linear-gradient(#38546E0d 1px,transparent 1px),linear-gradient(90deg,#38546E0d 1px,transparent 1px);background-size:32px 32px\">\n    <div style=\"max-width:1220px;margin:0 auto;padding:66px 40px 70px;display:grid;grid-template-columns:1.06fr .94fr;gap:56px;align-items:center\">\n      <div>\n        <div style=\"font:500 11px/1 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.24em;color:#38546E;margin-bottom:22px\">解读者 · ATMA DEGEYNDT<\u002Fdiv>\n        <h1 style=\"margin:0 0 24px;font:500 48px/1.28 'Songti SC',STSong,SimSun,serif;letter-spacing:.01em;color:#221F1A;max-width:16ch\">林肯博士信任、并托付传承的人。<\u002Fh1>\n        <p style=\"margin:0 0 16px;font:500 19px/1.6 'Songti SC',STSong,serif;color:#38546E\">十五年随侍在侧。一个必须守住的承诺。<\u002Fp>\n        <p style=\"margin:0;font:400 16px/1.9 'Songti SC',STSong,serif;color:#3C392F;max-width:40ch\">迈克尔·J·林肯博士读脸近五十年，只把这门方法教给极少数人。他对传给谁十分审慎——因为落到不当之人手里，一件如此锋利的工具，会割伤它所指向的那个人。他把我培养起来，托付我把他的工作延续下去；我郑重待之。我是唯一一个把这些写成书、并建起培训课程的学生。<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative\">\n        <div style=\"position:relative;border:1px solid #2B2A2626;background:#FCFAF3;padding:12px;box-shadow:0 8px 30px #2B2A2218\">\n          <div style=\"position:relative;width:100%;height:440px;overflow:hidden;background:#2B3A44\">\n            <img src=\"c68e0e9f-0e10-4466-8cf0-c0dd2b1ae54f\" alt=\"Atma Degeyndt\" style=\"width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block\">\n          <\u002Fdiv>\n          <div style=\"position:absolute;inset:12px;pointer-events:none\">\n            <div style=\"position:absolute;top:30%;left:4%;display:flex;align-items:center;gap:5px\"><span style=\"width:15px;height:15px;border-radius:50%;border:1px solid #EDE7D8;background:#1F2A3188;color:#F6F1E6;font:600 8px/14px 'PingFang SC',sans-serif;text-align:center\">1<\u002Fspan><span style=\"width:20px;height:1px;background:#EDE7D8aa\"><\u002Fspan><\u002Fdiv>\n            <span style=\"position:absolute;top:14px;right:14px;width:16px;height:16px\"><span style=\"position:absolute;top:7px;left:0;right:0;height:1px;background:#EDE7D888\"><\u002Fspan><span style=\"position:absolute;left:7px;top:0;bottom:0;width:1px;background:#EDE7D888\"><\u002Fspan><\u002Fspan>\n            <span style=\"position:absolute;bottom:12px;left:12px;font:500 9px/1 'PingFang SC',sans-serif;letter-spacing:.12em;color:#F0B4AC;background:#1F2A31aa;padding:3px 6px\">物证 · 解读者，被解读<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:22px;flex-wrap:wrap;margin:13px 6px 0;font:500 11px/1.5 'PingFang SC','Microsoft YaHei',sans-serif;color:#6C6857\">\n          <span><span style=\"color:#38546E;font-weight:600\">1<\u002Fspan>&nbsp;&nbsp;以慢功夫磨出来的眼力<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ WHAT FIFTEEN YEARS EARNS ============ -->\n  <section data-screen-label=\"apprenticeship\" style=\"max-width:1220px;margin:0 auto;padding:92px 40px\">\n    <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start;margin-bottom:56px\">\n      <div>\n        <div style=\"font:500 11px/1 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.24em;color:#38546E;margin-bottom:18px\">学徒生涯<\u002Fdiv>\n        <h2 style=\"margin:0;font:500 40px/1.26 'Songti SC',STSong,SimSun,serif;letter-spacing:.01em;color:#221F1A;max-width:14ch\">十五年，换来什么。<\u002Fh2>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 16px;font:400 16px/1.9 'Songti SC',STSong,serif;color:#3C392F\">学徒，不是一纸证书。我没有上个周末的短训班、再印一张名片。我在林肯博士身旁坐了数百场解读，看他如何工作，然后自己上手，由他一张脸一张脸地纠正我——前后将近二十年。他以自己求学的方式授业：盯着一样东西看，直到它交出自己的规律。<\u002Fp>\n        <p style=\"margin:0;font:500 18px/1.7 'Songti SC',STSong,serif;color:#38546E\">他交到我手上的，不是一门技巧，而是一双以慢功夫磨出来的眼睛，以及随之而来的洞见。<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #2B2A2622;background:#FCFAF3;border-radius:6px;overflow:hidden\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 28px 0\">\n        <div style=\"font:500 10px/1.5 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.16em;color:#38546E\">图 2 · 两种鲜少并存于一人身上的学养<\u002Fdiv>\n        <div style=\"font:400 13px/1.5 'Songti SC',STSong,serif;color:#6C6857\">林肯博士的面部解读，两者缺一不可。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1px 1fr;margin-top:20px\">\n        <div style=\"padding:8px 28px 28px\">\n          <div style=\"font:600 10px/1.5 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.12em;color:#8A8676;margin-bottom:12px\">西方 · 如何测量一颗心智<\u002Fdiv>\n          <h3 style=\"margin:0 0 8px;font:500 22px/1.4 'Songti SC',STSong,serif;color:#221F1A\">明尼苏达大学，六年。<\u002Fh3>\n          <p style=\"margin:0;font:400 14.5px/1.85 'Songti SC',STSong,serif;color:#3C392F\">教育心理学与认知心理学的研究生训练：西方那套关于「心智如何学习、又如何出错」的科学。<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#2B2A2618\"><\u002Fdiv>\n        <div style=\"padding:8px 28px 28px\">\n          <div style=\"font:600 10px/1.5 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.12em;color:#B3453A;margin-bottom:12px\">东方 · 如何观照一颗心智<\u002Fdiv>\n          <h3 style=\"margin:0 0 8px;font:500 22px/1.4 'Songti SC',STSong,serif;color:#221F1A\">僧侣生涯，九年。<\u002Fh3>\n          <p style=\"margin:0;font:400 14.5px/1.85 'Songti SC',STSong,serif;color:#3C392F\">一段苦行的日子：翻译梵文典籍，每日以数小时静观咒语。把「专注」当作一门修行，而非一项技巧。<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ TELEVISION ============ -->\n  <section data-screen-label=\"television\" style=\"background:#F1ECDE;border-top:1px solid #2B2A2618;border-bottom:1px solid #2B2A2618\">\n    <div style=\"max-width:1220px;margin:0 auto;padding:92px 40px;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center\">\n      <div>\n        <div style=\"font:500 11px/1 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.24em;color:#38546E;margin-bottom:18px\">镜头之上，有据可查<\u002Fdiv>\n        <h2 style=\"margin:0 0 22px;font:500 40px/1.26 'Songti SC',STSong,SimSun,serif;letter-spacing:.01em;color:#221F1A;max-width:16ch\">电视台一再称我为专家。<\u002Fh2>\n        <p style=\"margin:0 0 16px;font:400 16px/1.9 'Songti SC',STSong,serif;color:#3C392F\">2011 年，Style Network 在其剧集《Ruby》中，专门做了一集，由我为她做面部解读。署名写着 <i>Face Reading Expert（面部解读专家）<\u002Fi>，镜头也正是这样对待它的——不是噱头，而是一次真正想读懂椅子上那个人的尝试。<\u002Fp>\n        <p style=\"margin:0;font:400 16px/1.9 'Songti SC',STSong,serif;color:#3C392F\">那并非唯一一次。制作方在镜头前介绍我，用过「梵文专家」，用过「东方哲学权威」——当一档节目需要一个真能读懂眼前之人的人时，会请来的那种角色。<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"justify-self:center;width:100%;max-width:400px\">\n        <div style=\"border:1px solid #2B2A2626;background:#FCFAF3;box-shadow:0 6px 22px #2B2A2214;padding:26px 28px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2B2A2618;padding-bottom:14px;margin-bottom:16px\">\n            <span style=\"font:600 10px/1.5 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.12em;color:#38546E\">银幕署名<\u002Fspan>\n            <span style=\"font:500 10px/1.5 'PingFang SC','Microsoft YaHei',sans-serif;color:#8A8676\">已核实<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font:500 24px/1.3 'Songti SC',STSong,serif;color:#221F1A;margin-bottom:6px\">“Ruby Goes Under”<\u002Fdiv>\n          <div style=\"font:400 14px/1.7 'Songti SC',STSong,serif;color:#3C392F\">Style Network，2011。署名：<i>本人 —— 面部解读专家。<\u002Fi><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:18px;font:400 13.5px/1.6 'Songti SC',STSong,serif;color:#6C6857\">\n            <div style=\"display:flex;gap:10px\"><span style=\"color:#38546E\">—<\u002Fspan> 梵文专家<\u002Fdiv>\n            <div style=\"display:flex;gap:10px\"><span style=\"color:#38546E\">—<\u002Fspan> 东方哲学权威<\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"https://www.imdb.com/name/nm2098577/\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:7px;margin-top:20px;font:600 12px/1 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.03em;color:#38546E;border:1px solid #38546E55;border-radius:22px;padding:11px 18px\">IMDb 完整列表 <span style=\"font-size:14px\">›<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ AROUND THE WORLD ============ -->\n  <section data-screen-label=\"world\" style=\"max-width:1220px;margin:0 auto;padding:92px 40px\">\n    <div style=\"max-width:680px;margin-bottom:44px\">\n      <div style=\"font:500 11px/1 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.24em;color:#38546E;margin-bottom:18px\">由他人写就的证据<\u002Fdiv>\n      <h2 style=\"margin:0 0 16px;font:500 38px/1.3 'Songti SC',STSong,SimSun,serif;letter-spacing:.01em;color:#221F1A;max-width:20ch\">这门工作，带我走遍世界。<\u002Fh2>\n      <p style=\"margin:0;font:400 16px/1.9 'Songti SC',STSong,serif;color:#3C392F\">这门方法有效，最清楚的证明，不是我能说出的任何话，而是人们不待我开口便自己做的事。上过我课程的学员，各自召集起自己的小组，开办自己的入门班。有人把我请到世界另一端，当面授课、当面解读。也有人把日程排满，一场接一场地视频解读。没有人会为了一个客厅戏法，两次跨越重洋，或把日历填满一个陌生人的视频通话。<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px\">\n      <div style=\"border-top:2px solid #38546E;padding-top:16px\">\n        <div style=\"font:500 10px/1.5 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.14em;color:#8A8676;margin-bottom:10px\">城市 01<\u002Fdiv>\n        <h3 style=\"margin:0 0 6px;font:500 24px/1.3 'Songti SC',STSong,serif;color:#221F1A\">北京<\u002Fh3>\n        <p style=\"margin:0;font:400 13.5px/1.7 'Songti SC',STSong,serif;color:#3C392F\">昔日学员各自召集小组，把我请去授课。<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #38546E;padding-top:16px\">\n        <div style=\"font:500 10px/1.5 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.14em;color:#8A8676;margin-bottom:10px\">城市 02<\u002Fdiv>\n        <h3 style=\"margin:0 0 6px;font:500 24px/1.3 'Songti SC',STSong,serif;color:#221F1A\">台北<\u002Fh3>\n        <p style=\"margin:0;font:400 13.5px/1.7 'Songti SC',STSong,serif;color:#3C392F\">由结业学员开办入门课程，随后应邀当面解读。<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #B3453A;padding-top:16px\">\n        <div style=\"font:500 10px/1.5 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.14em;color:#B3453A;margin-bottom:10px\">城市 03<\u002Fdiv>\n        <h3 style=\"margin:0 0 6px;font:500 24px/1.3 'Songti SC',STSong,serif;color:#221F1A\">香港<\u002Fh3>\n        <p style=\"margin:0;font:400 13.5px/1.7 'Songti SC',STSong,serif;color:#3C392F\">工作坊与个人解读，隔着视频一场接一场地排满。<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-top:34px;padding-top:22px;border-top:1px solid #2B2A2620\">\n      <span style=\"font:500 10px/1.6 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.16em;color:#8A8676;margin-right:6px\">也曾在此解读 ···<\u002Fspan>\n      <span style=\"font:400 17px/1.3 'Songti SC',STSong,serif;color:#3C392F\">洛杉矶<\u002Fspan><span style=\"color:#B0A88E\">/<\u002Fspan>\n      <span style=\"font:400 17px/1.3 'Songti SC',STSong,serif;color:#3C392F\">纽约<\u002Fspan><span style=\"color:#B0A88E\">/<\u002Fspan>\n      <span style=\"font:400 17px/1.3 'Songti SC',STSong,serif;color:#3C392F\">亚特兰大<\u002Fspan><span style=\"color:#B0A88E\">/<\u002Fspan>\n      <span style=\"font:400 17px/1.3 'Songti SC',STSong,serif;color:#3C392F\">伦敦<\u002Fspan><span style=\"color:#B0A88E\">/<\u002Fspan>\n      <span style=\"font:400 17px/1.3 'Songti SC',STSong,serif;color:#3C392F\">布鲁塞尔<\u002Fspan><span style=\"color:#B0A88E\">/<\u002Fspan>\n      <span style=\"font:400 17px/1.3 'Songti SC',STSong,serif;color:#B3453A\">Black Rock City<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ THE PROMISE (dark gravity) ============ -->\n  <section data-screen-label=\"promise\" style=\"background:#1F2A31;color:#EDE7D8;background-image:linear-gradient(#EDE7D80a 1px,transparent 1px),linear-gradient(90deg,#EDE7D80a 1px,transparent 1px);background-size:34px 34px\">\n    <div style=\"max-width:900px;margin:0 auto;padding:100px 40px\">\n      <div style=\"font:500 11px/1.6 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.24em;color:#86A6BF;margin-bottom:22px;text-align:center\">开头提到的那个承诺<\u002Fdiv>\n      <h2 style=\"margin:0 0 40px;font:500 42px/1.3 'Songti SC',STSong,SimSun,serif;letter-spacing:.01em;color:#F6F1E6;text-align:center;max-width:20ch;margin-left:auto;margin-right:auto\">我为什么不会用它去算计人。<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:44px;max-width:800px;margin:0 auto 44px\">\n        <p style=\"margin:0;font:400 16px/1.95 'Songti SC',STSong,serif;color:#D4CEBF\">若干年前，在洛杉矶。一桩我不便在此细说的事，请我去解读一张脸——那是一个利害真实、且牵涉法律的场合。我做了那次解读；我也看见了，当这门工作被指向一个人、意在拿捏他而非理解他时，会发生什么。我于是明白了，林肯博士为何毕其一生坚持：让它远离法庭。<\u002Fp>\n        <p style=\"margin:0;font:400 16px/1.95 'Songti SC',STSong,serif;color:#D4CEBF\">后来，一位私家侦探请我做类似的事。我回绝了；自那以后，凡是这类请求，我一律回绝。这门方法把人看得通透见底，而那样的目光，属于帮助他们，不属于战胜他们。<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:0 auto;font:500 26px/1.7 'Songti SC',STSong,serif;color:#F6F1E6;text-align:center;max-width:26ch\">看得这样深的目光，属于帮助人，绝不属于战胜人。<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ CTA ============ -->\n  <section data-screen-label=\"cta\" style=\"background:#F1ECDE;border-top:1px solid #2B2A2618\">\n    <div style=\"max-width:820px;margin:0 auto;padding:96px 40px;text-align:center\">\n      <div style=\"font:500 11px/1.6 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.24em;color:#38546E;margin-bottom:22px\">下一步很简单<\u002Fdiv>\n      <h2 style=\"margin:0 0 26px;font:500 44px/1.28 'Songti SC',STSong,SimSun,serif;letter-spacing:.01em;color:#221F1A;max-width:22ch;margin-left:auto;margin-right:auto\">如果您愿意，让这个人来为您解读。<\u002Fh2>\n      <a href=\"Intake.zh.dc.html\" style=\"display:inline-flex;align-items:center;gap:10px;background:#B3453A;color:#F6F2E9;font:700 14px/1 'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.04em;padding:18px 36px;border-radius:32px\">预约解读 <span style=\"font-size:16px\">›<\u002Fspan><\u002Fa>\n      <p style=\"margin:20px auto 0;font:400 13px/1.7 'PingFang SC','Microsoft YaHei',sans-serif;color:#6C6857;max-width:56ch\">一张照片，75 分钟，一份录像与一份书面报告。<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"background:#1F2A31;color:#C9C2B3\">\n    <div style=\"max-width:1220px;margin:0 auto;padding:52px 40px 44px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:14px\">\n          <span style=\"width:24px;height:24px;display:inline-block\"><svg w
